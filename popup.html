<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lucidity</title>
  <style>
    :root {
      --bg: #1a1d21;
      --surface: #24282e;
      --surface-2: #2e333b;
      --border: #353b44;
      --accent: #339989;
      --accent-hover: #3dab9b;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --success: #4caf7d;
      --error: #e57373;
      --warning: #e5a653;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 380px;
      height: 520px;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header img {
      width: 20px;
      height: 20px;
    }

    header strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    #status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-left: auto;
    }

    #status-dot.ok {
      background: var(--success);
    }

    #status-dot.error {
      background: var(--error);
    }

    #status-dot.loading {
      background: var(--warning);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }

    #settings-toggle {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 7px;
    }

    #settings-toggle:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    #settings-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    #settings-panel label {
      display: block;
      margin-bottom: 4px;
    }

    #model-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }

    #model-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .switch input {
      accent-color: var(--accent);
    }

    #context-banner {
      margin: 8px 12px 0;
      padding: 5px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px 4px;
    }

    #actions button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      padding: 9px 6px;
      transition: border-color 0.15s, background 0.15s, transform 0.05s;
    }

    #actions button:hover:not(:disabled) {
      background: var(--surface-2);
      border-color: var(--accent);
    }

    #actions button:active:not(:disabled) {
      transform: scale(0.98);
    }

    #actions button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #actions .action-icon {
      display: inline-flex;
    }

    #actions .action-icon svg {
      width: 15px;
      height: 15px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #chat p {
      margin: 0;
      padding: 8px 12px;
      border-radius: var(--radius);
      max-width: 88%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #chat p[data-kind="user"] {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    #chat p[data-kind="assistant"] {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    #chat p[data-kind="loading"] {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      animation: pulse 1.2s ease-in-out infinite;
    }

    #chat p[data-kind="error"] {
      align-self: flex-start;
      background: rgba(229, 115, 115, 0.12);
      border: 1px solid rgba(229, 115, 115, 0.4);
      color: #f0a8a8;
      white-space: pre-wrap;
    }

    .chat__empty {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 12.5px;
    }

    .chat__empty .chat__empty-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    #composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #question-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      resize: none;
    }

    #question-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #question-input::placeholder {
      color: var(--text-muted);
    }

    #send-button {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    #send-button svg {
      width: 16px;
      height: 16px;
    }

    #send-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    #send-button:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon16.png" alt="" />
    <strong>Lucidity</strong>
    <span id="status-dot" title="Status: unknown"></span>
    <button id="settings-toggle" type="button" title="Settings">⚙</button>
  </header>

  <section id="settings-panel" hidden>
    <label for="model-input">Ollama model</label>
    <input
      type="text"
      id="model-input"
      value="lfm2.5-thinking:1.2b"
      spellcheck="false"
    />
    <label class="switch">
      <input type="checkbox" id="use-context-toggle" checked />
      Use page context
    </label>
  </section>

  <div id="context-banner" hidden>
    <span id="context-banner-text"></span>
  </div>

  <div id="actions">
    <button id="summarize-button" type="button" disabled>
      <span class="action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-chevrons-down-up"><path d="M3 5h8"/><path d="M3 12h8"/><path d="M3 19h8"/><path d="m15 5 3 3 3-3"/><path d="m15 19 3-3 3 3"/></svg></span> Summarize
    </button>
    <button id="explain-button" type="button" disabled>
      <span class="action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-puzzle"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg></span> Explain simply
    </button>
  </div>

  <main id="chat"></main>

  <form id="composer">
    <textarea
      id="question-input"
      placeholder="Ask about this page…"
      rows="2"
    ></textarea>
    <button id="send-button" type="submit" title="Send"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
